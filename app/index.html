 if(!S.outM)S.outM=S.dbl?"d":"s";

function roll(el,from,to){
 const t0=performance.now(),dur=Math.min(900,350+Math.abs(from-to)*3);
 el.classList.add("roll");el.textContent=from;
 const step=now=>{
  if(!el.isConnected)return;
  const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
  el.textContent=Math.round(from+(to-from)*e);
  if(k<1)requestAnimationFrame(step);else{el.textContent=to;el.classList.remove("roll")}
 };
 requestAnimationFrame(step);
}

 if(sig=="edit"){const i=list.find(x=>x.matches(".er input"));if(i)return i}
 return list.find(x=>!x.closest(".top"))||list[0];
}
let navX=null,inNav=false;
// a fókuszálható elemeket vizuális sorokba rendezzük: ↑/↓ sort vált, ←/→ a soron belül (és a sorok között) lép
function navRows(list){
 const it=list.map(el=>{const r=el.getBoundingClientRect();return{el,cx:r.left+r.width/2,cy:r.top+r.height/2,h:r.height}}).sort((a,b)=>a.cy-b.cy);
 const rows=[];
 for(const x of it){
  const row=rows[rows.length-1];
  if(row&&Math.abs(x.cy-row.cy)<=.5*Math.min(x.h,row.h))row.items.push(x);else rows.push({cy:x.cy,h:x.h,items:[x]});
 }
 rows.forEach(r=>r.items.sort((a,b)=>a.cx-b.cx));
 return rows;
}
function navMove(dir){
 const list=focusables(navScope());if(!list.length)return;
 const cur=document.activeElement;
 const go=el=>{inNav=true;el.focus();inNav=false;if(el.tagName=="INPUT"&&el.type!="checkbox")try{el.select()}catch(e){}try{el.scrollIntoView({block:"nearest"})}catch(e){}};
 if(!list.includes(cur)){navX=null;go(defFocus(list,viewSig()));return}
 const rows=navRows(list);
 let ri=-1,ci=-1;
 rows.forEach((r,i)=>r.items.forEach((x,j)=>{if(x.el===cur){ri=i;ci=j}}));
 if(ri<0)return;
 const me=rows[ri].items[ci];
 if(dir=="ArrowRight"||dir=="ArrowLeft"){
  navX=null;
  let t=null;
  if(dir=="ArrowRight")t=rows[ri].items[ci+1]||(rows[ri+1]&&rows[ri+1].items[0]);
  else t=rows[ri].items[ci-1]||(rows[ri-1]&&rows[ri-1].items[rows[ri-1].items.length-1]);
  if(t)go(t.el);
  return;
 }
 if(navX==null)navX=me.cx;
 const nr=rows[dir=="ArrowDown"?ri+1:ri-1];
 if(!nr)return;
 let best=nr.items[0];
 for(const x of nr.items)if(Math.abs(x.cx-navX)<Math.abs(best.cx-navX))best=x;
 go(best.el);
}

const ORD=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
// s = szórás mm-ben (nyilanként), a = várható 3 nyilas átlag, h = duplára dobás találati aránya
const BOT=[
 {n:"Újonc",s:31.8,a:22,h:6,m:1.5},{n:"Kezdő",s:24.5,a:30,h:9,m:1.8},{n:"Alkalmi",s:18.9,a:40,h:14,m:2.3},{n:"Hétvégi",s:15.5,a:50,h:18,m:2.7},
 {n:"Haladó",s:12.9,a:60,h:23,m:3.1},{n:"Klubszintű",s:10.9,a:70,h:28,m:3.6},{n:"Ligajátékos",s:9.3,a:80,h:33,m:4.0},
 {n:"Versenyző",s:7.7,a:90,h:39,m:4.6},{n:"Profi",s:6.4,a:100,h:46,m:5.0},{n:"Világklasszis",s:5.4,a:110,h:53,m:5.6}];
const botName=lv=>"Bot · "+BOT[cl(lv,1,10)-1].n;
const DPREF={32:10,16:9,40:9,8:8,24:7,36:6,20:6,4:5,12:5,28:4,10:4,50:5,2:3,18:3,6:3,14:3,22:2,26:2,30:2,34:2,38:2};
const gauss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())};
// a tábla mm-ben: (0,0) a közép, y lefelé nő
function hitAt(x,y){
 const r=Math.hypot(x,y);
 if(r<6.35)return{v:50,l:"Bull",d:true,t:false};
 if(r<15.9)return{v:25,l:"25",d:false};
 if(r>=170)return{v:0,l:"–",d:false};
 const a=(Math.atan2(x,-y)*180/Math.PI+360+9)%360,n=ORD[Math.floor(a/18)];
 if(r>=162)return{v:2*n,l:"D"+n,d:true};
 if(r>=99&&r<107)return{v:3*n,l:"T"+n,d:false,t:true};
 return{v:n,l:""+n,d:false};
}
function tokXY(t){
 if(t=="Bull"||t=="25")return[0,0];
 const m=t[0],n=m=="T"||m=="D"?+t.slice(1):+t,R=m=="T"?103:m=="D"?166:135,a=ORD.indexOf(n)*Math.PI/10;
 return[R*Math.sin(a),-R*Math.cos(a)];
}
const toks=r=>{const q=routeFor(r);return q?q.split(" · "):[]};
// mire céloz a bot (r = maradék, left = hátralévő nyilak)
function botAim(r,left,ent,aware){
 if(S.din&&!ent)return S.inM=="m"?"T20":"D20";
 if(r==50)return"Bull";
 const tk=toks(r);
 if(aware&&tk.length&&tk.length<=left)return tk[0];
 if(aware&&S.dbl&&r<=110){
  let best="T20",bs=-1;
  for(let k=20;k>=1;k--)for(const t of ["T"+k,""+k]){
   const v=t[0]=="T"?3*k:k,l=r-v;if(l<2)continue;
   let sc=DPREF[l]||0;if(!sc&&toks(l).length<=2)sc=1;
   sc=sc*1000+v;if(sc>bs){bs=sc;best=t}
  }
  return best;
 }
 if(!aware){
  if(S.dbl){if(r<=40)return r%2?"1":"D"+r/2}
  else if(r<=20)return""+r;
  if(r<=60)return"20";
 }
 return"T20";
}
// egy bot-kör szimulációja: 3 nyíl, a találatok koordinátáival
function botTurn(p,lv,form){
 const L=BOT[cl(lv,1,10)-1],aware=Math.random()<cl((lv-2)/7,0,1),sg=L.s*(form||1);
 let r=p.r,ent=p.o,v=0,e=0,dd=0,fin=false,bust=false;const darts=[];
 for(let i=0;i<3&&!fin&&!bust;i++){
  const tk=botAim(r,3-i,ent,aware),[ax,ay]=tokXY(tk);
  if(S.dbl&&ent&&DVS.has(r)&&(tk[0]=="D"||tk=="Bull"||(S.outM=="m"&&tk[0]=="T")))dd++;
  const x=ax+sg*gauss(),y=ay+sg*gauss(),h=hitAt(x,y);
  let sc=h.v;
  if(!ent){if(h.d||(S.inM=="m"&&h.t)){ent=true;e=i+1}else sc=0}
  const r2=r-sc;
  const bs=r2<0||(S.dbl&&(r2==1||(r2==0&&!(h.d||(S.outM=="m"&&h.t)))));
  darts.push({l:h.l,v:sc,x,y,miss:h.v==0});
  if(bs){bust=true;break}
  v+=sc;r=r2;
  if(r==0)fin=true;
 }
 return{darts,v:bust?0:v,d:bust?3:darts.length,dd,e,fin,bust};
}

const wedge=(r0,r1,a0,a1)=>{
 const P=(r,a)=>[(r*Math.sin(a*Math.PI/180)).toFixed(2),(-r*Math.cos(a*Math.PI/180)).toFixed(2)];
 const A=P(r1,a0),B=P(r1,a1),C=P(r0,a1),D=P(r0,a0);
 return `M${A}A${r1} ${r1} 0 0 1 ${B}L${C}A${r0} ${r0} 0 0 0 ${D}Z`;
};
const BOARD=(()=>{

 ORD.forEach((n,i)=>{
  const a0=i*18-9,a1=i*18+9,ev=i%2==0,single=ev?"#1d1f24":"#e9dfc4",mult=ev?"#d32f2f":"#1b8a3a";
  s+=`<path d="${wedge(15.9,99,a0,a1)}" fill="${single}"/><path d="${wedge(99,107,a0,a1)}" fill="${mult}"/><path d="${wedge(107,162,a0,a1)}" fill="${single}"/><path d="${wedge(162,170,a0,a1)}" fill="${mult}"/>`;
  const a=i*18*Math.PI/180;
  s+=`<text x="${(184*Math.sin(a)).toFixed(1)}" y="${(-184*Math.cos(a)+7).toFixed(1)}" text-anchor="middle" font-size="21" font-weight="700" fill="#f2f2f2" font-family="system-ui,sans-serif">${n}</text>`;
 });
 return s+`<circle r="15.9" fill="#1b8a3a"/><circle r="6.35" fill="#d32f2f"/><circle r="170" fill="none" stroke="#888" stroke-width=".8"/>`;
})();

const ckSort=a=>[...a].sort((x,y)=>(x==25)-(y==25)||y-x);
const CKSC={std:"Standard",cut:"Cut-throat",none:"Pont nélküli"};
const CKNM={c:"15–20",t:"10–20",r:"Random",u:"Egyéni"};

function ckNumsFor(){
 if(S.ckn=="t")return [20,19,18,17,16,15,14,13,12,11,10,25];
 if(S.ckn=="u"){const a=(S.cku||[]).filter(n=>n>=1&&n<=20||n==25);return ckSort(a.length?a:[20,19,18,17,16,15,25])}
 if(S.ckn=="r"){const p=[...Array(20)].map((_,i)=>i+1);for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return ckSort([...p.slice(0,6),25])}
 return [20,19,18,17,16,15,25];
}
const ckU=i=>G.team?i%2:i;
function ckInitLeg(){
 G.u.forEach(u=>{
  u.m={};u.pt=0;let tot=u.mem.reduce((a,i)=>a+(G.p[i].hc||0),0);
  for(const n of G.nums){const g=Math.min(3,tot);if(g>0)u.m[n]=g;tot-=g;if(tot<=0)break}
 });
}
function newCk(){

 const g={ck:1,p:pl,u,team,nums:ckNumsFor(),c:f,ls:f,f,w:-1,t:[],lg:0};
 G=g;ckInitLeg();return g;

// egy nyíl hatása (units: egységek tömbje; u: az aktuális egység)
function ckHit(units,u,d){
 if(!d.n||!G.nums.includes(d.n))return{mk:0,pt:0};
 const me=units[u],have=me.m[d.n]||0,add=Math.min(d.m,3-have),ex=d.m-add;
 me.m[d.n]=have+add;
 let pt=0;
 if(ex>0&&S.cks!="none"){
  const opp=units.filter((x,j)=>j!=u&&(x.m[d.n]||0)<3);
  if(opp.length){
   if(S.cks=="std"){me.pt+=ex*d.n;pt=ex*d.n}
   else{opp.forEach(x=>x.pt+=ex*d.n);pt=ex*d.n*opp.length}
  }
 }
 return{mk:d.m,pt};
}
function ckWon(units,u){
 const me=units[u];
 if(!G.nums.every(n=>(me.m[n]||0)>=3))return false;
 if(S.cks=="std")return units.every((x,j)=>j==u||me.pt>=x.pt);
 if(S.cks=="cut")return units.every((x,j)=>j==u||me.pt<=x.pt);
 return true;
}
function ckAddDart(d0){
 const d={n:d0.n||0,m:d0.n?d0.m||1:0};
 let t=G.t[G.t.length-1];
 if(!t||t.dn||t.i!=G.c){t={i:G.c,d:[],lg:G.lg,dn:false};G.t.push(t)}
 const u=ckU(G.c),r=ckHit(G.u,u,d);d.mk=r.mk;d.pt=r.pt;
 t.d.push(d);
 if(ckWon(G.u,u)){t.dn=true;ckLegEnd(u);if(LIVE){const U=G.u[u];sayDart(d,G.w>=0?{match:1,n:U.n}:{leg:1,n:U.n,st:G.p[G.c].n})}return}
 if(LIVE)sayDart(d);
 if(t.d.length>=3){t.dn=true;G.c=(G.c+1)%G.p.length}
}
function ckLegEnd(u){
 const U=G.u[u];U.l++;U.tl++;let set=false;
 if(U.l>=NL()){U.s++;set=true;G.u.forEach(x=>x.l=0)}
 if(U.s>=NS()){G.w=u;return}

 G.lg++;G.ls=(G.ls+1)%G.p.length;G.c=G.ls;ckInitLeg();

function ckReplay(turns){
 G.u.forEach(x=>{x.m={};x.pt=0;x.l=x.s=x.tl=0});
 G.c=G.ls=G.f;G.w=-1;G.lg=0;G.t=[];ckInitLeg();
 turns.forEach((t,k)=>{
  for(const d of t.d){if(G.w>=0)break;ckAddDart(d)}
  const lt=G.t[G.t.length-1];
  if(G.w<0&&k<turns.length-1&&lt&&!lt.dn){lt.dn=true;G.c=(G.c+1)%G.p.length}
 });
 msg="";legPop=null;
}

// ----- bot -----
function ckAim(units,u,aware,sg){
 const me=units[u],opp=units.filter((_,j)=>j!=u),N=G.nums;
 const open=N.filter(n=>(me.m[n]||0)<3);
 const sc=N.filter(n=>(me.m[n]||0)>=3&&opp.some(x=>(x.m[n]||0)<3));
 const need=S.cks=="std"?opp.some(x=>me.pt<x.pt):S.cks=="cut"?opp.some(x=>me.pt>x.pt):false;
 const val=n=>n==25?22:n;
 let tgt;
 if(!aware)tgt=open.length?open[0]:(sc[0]||N[0]);
 else if(sc.length&&(need||!open.length)){
  tgt=sc.reduce((b,n)=>{const w=val(n)*(S.cks=="cut"?opp.filter(x=>(x.m[n]||0)<3).length:1);return w>b.w?{n,w}:b},{n:sc[0],w:-1}).n;
 }else if(open.length){
  const pr=n=>val(n)+(me.m[n]||0)*4+(opp.some(x=>(x.m[n]||0)>=3)?30:0);
  tgt=open.reduce((b,n)=>pr(n)>pr(b)?n:b,open[0]);
 }else tgt=sc[0]||N[0];
 if(tgt==25)return"Bull";
 const k=me.m[tgt]||0;
 return sg<=19.5&&(k>=3||3-k>=2)?"T"+tgt:""+tgt;
}
function ckBotTurn(pi,lv,form){
 const L=BOT[cl(lv,1,10)-1],aware=Math.random()<cl((lv-2)/7,0,1),sg=L.s*(form||1);
 const units=JSON.parse(JSON.stringify(G.u)),u=ckU(pi),darts=[];let win=false;
 for(let i=0;i<3&&!win;i++){
  const a=ckAim(units,u,aware,sg),[ax,ay]=tokXY(a);
  const x=ax+sg*gauss(),y=ay+sg*gauss(),h=hitAt(x,y);
  let n=0,m=0;

  const r=ckHit(units,u,{n,m});

function hsSync(){
 if(!G||(OL&&OL.spec))return;
 const id=OL?"o"+OL.id+"."+OL.gen:G.hid;
 if(G.w>=0){
  const nid=id||(G.hid=Math.random().toString(36).slice(2,10));
  const sig=G.t.length+":"+G.w;
  if(HSSIG[nid]===sig)return;
  HSSIG[nid]=sig;delete HDEL[nid];
  const r=hsRec(nid),i=HS.findIndex(x=>x.id==nid);
  if(i>=0){r.ts=HS[i].ts;HS[i]=r}else HS.push(r);
  HS.sort((a,b)=>b.ts-a.ts);if(HS.length>HS_MAX)HS.length=HS_MAX;
  r.pl.forEach(p=>{if(!p.b)plAdd(p.n)});
  hsStore();
  try{acSyncSoon()}catch(e){}
 }else if(id&&HSSIG[id]){
  delete HSSIG[id];const i=HS.findIndex(x=>x.id==id);if(i>=0){HS.splice(i,1);hsStore()}
 }
}

function plStat(name){
 const k=hsNm(name),R=HS.filter(r=>r.pl.some(p=>hsNm(p.n)==k&&!p.b));
 const o={m:R.length,w:0,x:{m:0,sm:0,dt:0,hi:0,a1:0,a2:0,a3:0,co:0,w:0},c:{m:0,mk:0,dt:0,best:0,tri:0,dbl:0,w:0},opp:{}};
 for(const r of R){
  const me=r.pl.find(p=>hsNm(p.n)==k&&!p.b);o.w+=me.w;
  const t=r.gm=="ck"?o.c:o.x;t.m++;t.w+=me.w;
  if(r.gm=="ck"){t.mk+=me.mk;t.dt+=me.dt;t.best=Math.max(t.best,me.best);t.tri+=me.tri;t.dbl+=me.dbl}
  else{t.sm+=me.sm;t.dt+=me.dt;t.hi=Math.max(t.hi,me.hi);t.a1+=me.a1;t.a2+=me.a2;t.a3+=me.a3;t.co=Math.max(t.co,me.co)}
  for(const p of r.pl)if(p.u!=me.u){const e=o.opp[p.n]=o.opp[p.n]||{n:p.n,b:p.b,w:0,l:0};if(me.w)e.w++;else e.l++}
 }
 o.x.avg=o.x.dt?3*o.x.sm/o.x.dt:null;o.c.mpr=o.c.dt?3*o.c.mk/o.c.dt:null;
 return o;
}
const hsDate=ts=>{try{return new Date(ts).toLocaleString(LANG=="de"?"de-DE":LANG=="en"?"en-GB":"hu-HU",{dateStyle:"short",timeStyle:"short"})}catch(e){return new Date(ts).toISOString().slice(0,16).replace("T"," ")}};
const hsScore=r=>{ // „Anna 2 – 1 Béla” (csapatjátéknál csapatonként)
 const seen=new Set(),us=[];
 r.pl.forEach(p=>{if(!seen.has(p.u)){seen.add(p.u);us.push({n:r.pl.filter(q=>q.u==p.u).map(q=>q.n).join(" & "),w:p.w,v:r.ns>1?p.s:p.tl})}});
 return us;
};

 const W=340,H=120,pl=30,pr=10,pt=10,pb=18,mx=Math.max(...pts),mn=Math.min(...pts),lo=Math.floor(mn/10)*10,hi=Math.max(lo+10,Math.ceil(mx/10)*10);

function hsImage(r){
 return new Promise((res,rej)=>{
  try{
   const cs=getComputedStyle(document.documentElement),v=n=>(cs.getPropertyValue(n)||"").trim();
   const C={bg:v("--bg")||"#f4f5f7",card:v("--card")||"#fff",tx:v("--tx")||"#14181f",mut:v("--mut")||"#6b7280",ac:v("--ac")||"#16a34a",bd:v("--bd")||"#d9dde3"};
   const us=hsScore(r),rows=hsRows(r),np=r.pl.length,two=us.length==2;
   const W=1080,pad=48,rowH=66,F='system-ui,-apple-system,"Segoe UI",Roboto,"Noto Color Emoji",sans-serif';
   const resH=two?150:us.length*76+20,H=pad+70+44+resH+30+(rows.length+1)*rowH+30+70+pad;
   const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
   const fit=(t,max)=>{t=String(t);if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+"…").width>max)t=t.slice(0,-1);return t+"…"};
   const rr=(a,b,w,h,rad)=>{x.beginPath();x.moveTo(a+rad,b);x.arcTo(a+w,b,a+w,b+h,rad);x.arcTo(a+w,b+h,a,b+h,rad);x.arcTo(a,b+h,a,b,rad);x.arcTo(a,b,a+w,b,rad);x.closePath()};
   x.fillStyle=C.bg;x.fillRect(0,0,W,H);
   rr(pad/2,pad/2,W-pad,H-pad,28);x.fillStyle=C.card;x.fill();x.strokeStyle=C.bd;x.lineWidth=2;x.stroke();
   const L=pad+16,R=W-pad-16;let y=pad+16;
   x.textBaseline="alphabetic";
   x.fillStyle=C.tx;x.font="700 46px "+F;x.fillText(fit("🎯 "+T(r.lb),R-L),L,y+46);y+=70;
   x.fillStyle=C.mut;x.font="400 28px "+F;x.fillText(hsDate(r.ts)+(r.on?"  ·  🌐 online":""),L,y+26);y+=44;
   // eredmeny
   if(two){
    const half=(R-L)/2-90;
    us.forEach((u,k)=>{
     x.font="700 44px "+F;x.fillStyle=u.w?C.ac:C.tx;const t=fit((u.w?"🏆 ":"")+u.n,half);
     x.textAlign=k?"left":"right";x.fillText(t,k?(L+R)/2+100:(L+R)/2-100,y+88);
    });
    x.textAlign="center";x.fillStyle=C.tx;x.font="800 84px "+F;x.fillText(us[0].v+" – "+us[1].v,(L+R)/2,y+100);
    x.textAlign="left";y+=resH;
   }else{
    us.forEach((u,k)=>{
     x.font="700 40px "+F;x.fillStyle=u.w?C.ac:C.tx;x.textAlign="left";x.fillText(fit((u.w?"🏆 ":"")+u.n,R-L-160),L,y+56+k*76);
     x.textAlign="right";x.fillText(String(u.v),R,y+56+k*76);
    });
    x.textAlign="left";y+=resH;
   }
   y+=30;
   // tabla
   const c0=330,cw=(R-L-c0)/np;
   rr(L-8,y,R-L+16,rowH,12);x.fillStyle=C.bg;x.fill();
   x.fillStyle=C.mut;x.font="600 26px "+F;x.textAlign="right";
   r.pl.forEach((p,i)=>x.fillText(fit(p.n,cw-16),L+c0+cw*(i+1)-12,y+44));
   y+=rowH;
   rows.forEach(([l,f],k)=>{
    if(k%2==1){rr(L-8,y,R-L+16,rowH,12);x.fillStyle=C.bg;x.globalAlpha=.55;x.fill();x.globalAlpha=1}
    x.textAlign="left";x.fillStyle=C.mut;x.font="400 27px "+F;x.fillText(fit(T(l),c0-12),L,y+44);
    x.textAlign="right";x.fillStyle=C.tx;x.font="700 30px "+F;
    r.pl.forEach((p,i)=>x.fillText(fit(String(f(p)),cw-16),L+c0+cw*(i+1)-12,y+44));
    y+=rowH;
   });
   x.textAlign="left";x.fillStyle=C.mut;x.font="400 24px "+F;x.fillText("🎯 "+(clubGet().club?clubGet().club+" · ":"")+"GozieDarts",L,H-pad-10);
   cv.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png");
  }catch(e){rej(e)}
 });
}

function hsImport(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const o=JSON.parse(rd.result);
   if(!o||o.app!="darts"||!Array.isArray(o.hist))throw 0;
   const have=new Set(HS.map(x=>x.id));let add=0;
   for(const r of o.hist){
    if(!r||typeof r.id!="string"||!Array.isArray(r.pl)||!r.pl.length||typeof r.ts!="number"||(r.gm!="x01"&&r.gm!="ck"))continue;
    if(have.has(r.id))continue;
    r.pl=r.pl.filter(p=>p&&typeof p.n=="string");if(!r.pl.length)continue;
    HS.push(r);have.add(r.id);add++;
   }
   if(Array.isArray(o.players))o.players.forEach(n=>{if(typeof n=="string")plAdd(n)});
   HS.sort((a,b)=>b.ts-a.ts);if(HS.length>HS_MAX)HS.length=HS_MAX;hsStore();
   toast(add?"Betöltve: "+add+" új meccs.":"Nem volt új meccs a fájlban.");
   try{acSyncSoon()}catch(e){}
   hsScreen();
  }catch(e){toast("Ez nem érvényes mentésfájl.")}
 };
 rd.onerror=()=>toast("A fájl nem olvasható.");
 rd.readAsText(f);inp.value="";
}

async function acSync(silent){
 if(!AC||acBusy)return false;
 acBusy=true;
 try{
  const key=ACSK+":"+AC.name.toLowerCase();let done=[];
  try{done=JSON.parse(lsGet(key)||"[]")}catch(e){}
  const set=new Set(done);
  const up=HS.filter(r=>r&&r.id&&!set.has(acSig(r))).slice(0,100);
  const r=await olApi("hsync",Object.assign({recs:up,del:Object.keys(HDEL),pl:PLAYERS.map(n=>({n,ts:PLTS[hsNm(n)]||1})),pdel:PLDEL},acTok()));
  if(r.auth){acDrop();if(!silent)toast("A bejelentkezés lejárt, jelentkezz be újra.");return false}
  if(!r.ok){if(!silent)toast(r.err||"Hiba");return false}
  up.forEach(x=>set.add(acSig(x)));
  // más eszközön törölt meccsek / játékosok
  let chg=0;
  for(const id in (r.hdel||{})){if(!HDEL[id]){HDEL[id]=r.hdel[id];chg++}const i=HS.findIndex(x=>x.id==id);if(i>=0){HS.splice(i,1);chg++}}
  for(const k in (r.pdel||{})){const ts=r.pdel[k];if((PLTS[k]||1)<=ts&&PLAYERS.some(p=>hsNm(p)==k)){PLAYERS=PLAYERS.filter(p=>hsNm(p)!=k);delete PLTS[k];chg++}if((PLDEL[k]||0)<ts)PLDEL[k]=ts}
  for(const q of r.pl||[]){if(!q||!q.n)continue;const k=hsNm(q.n);if((PLDEL[k]||0)>=q.ts)continue;if(plAdd(q.n,q.ts))chg++}
  const have=new Set(HS.map(x=>x.id));let add=0;
  for(const x of r.hist||[]){
   if(!x||!x.id||HDEL[x.id])continue;
   if(!have.has(x.id)){HS.push(x);add++}
   set.add(acSig(HS.find(y=>y.id==x.id)))
  }
  if(add){HS.sort((a,b)=>b.ts-a.ts);if(HS.length>HS_MAX)HS.length=HS_MAX}
  if(add||chg)hsStore();
  lsSet(key,JSON.stringify([...set].slice(-1500)));
  lsSet("darts-acsync",String(Date.now()));
  if(!silent)toast(add?"Szinkronizálva – "+add+" új meccs a fiókból.":"Szinkronizálva.");
  return true;
 }finally{acBusy=false}
}

async function lnkDrop(name){

let lnkBusy=false;
async function lnkSync(only){
 if(lnkBusy)return;lnkBusy=true;
 try{
  for(const L of LNK.slice()){
   if(only&&L!==only)continue;
   if(AC&&hsNm(AC.name)==hsNm(L.name))continue;
   const key="darts-lnkd:"+hsNm(L.name);let done=new Set();
   try{done=new Set(JSON.parse(lsGet(key)||"[]"))}catch(e){}
   const up=HS.filter(r=>r&&r.id&&!done.has(acSig(r))&&Array.isArray(r.pl)&&r.pl.some(p=>p&&hsNm(p.n)==hsNm(L.name))).slice(0,100);
   const r=await olApi("hsync",{recs:up,uname:L.name,token:L.token});
   if(r.auth){LNK=LNK.filter(x=>x!==L);lnkSave();toast(L.name+": "+T("a bejelentkezés lejárt, kösd össze újra."));continue}
   if(!r.ok)continue;
   up.forEach(x=>done.add(acSig(x)));
   const have=new Set(HS.map(x=>x.id));let add=0;
   for(const x of r.hist||[]){
    if(!x||!x.id||HDEL[x.id])continue;
    if(!have.has(x.id)){HS.push(x);have.add(x.id);add++}
    done.add(acSig(HS.find(y=>y.id==x.id)))
   }
   if(add){HS.sort((a,b)=>b.ts-a.ts);if(HS.length>HS_MAX)HS.length=HS_MAX;hsStore()}
   lsSet(key,JSON.stringify([...done].slice(-1500)));
  }
 }finally{lnkBusy=false}
}

// ----- számítás: a napló alapján mindig újraszámolva -----
function trCalc(T){
 const P=T.names.length;
 if(T.k=="atc"){
  const pl=T.names.map(n=>({n,pos:0,dt:0,done:false}));let c=0,dt=0,over=false;
  for(const d of T.log){
   const q=pl[c];q.dt++;dt++;q.pos+=d;if(q.pos>=21){q.pos=21;q.done=true}
   if(q.done||dt>=3){
    dt=0;let n=-1;for(let k=1;k<=P;k++){const ix=(c+k)%P;if(!pl[ix].done){n=ix;break}}
    if(n<0)over=true;
    else if(n<=c&&pl.some(x=>x.done))over=true;
    else c=n;
   }
   if(over)break;
  }
  return{pl,c,dt,over};
 }
 if(T.k=="sh"){
  const pl=T.names.map(n=>({n,sc:0,sh:0}));let c=0,rnd=1,dt=0,over=false,win=-1,cur=[];
  for(const m of T.log){
   const q=pl[c];q.sc+=m*rnd;cur.push(m);dt++;
   if(dt>=3){
    if(cur.includes(1)&&cur.includes(2)&&cur.includes(3)){q.sh++;if(T.o.sw){over=true;win=c;break}}
    dt=0;cur=[];c++;if(c>=P){c=0;rnd++;if(rnd>T.o.sr){over=true;break}}
   }
  }
  return{pl,c,rnd,dt,over,win};
 }
 if(T.k=="b27"){
  const pl=T.names.map(n=>({n,sc:27,r:0,done:false,out:false}));let c=0,over=false;
  for(const h of T.log){
   const q=pl[c],v=q.r==20?50:2*(q.r+1);
   q.sc+=h?h*v:-v;q.r++;
   if(q.sc<=0){q.out=true;q.done=true}else if(q.r>=21)q.done=true;
   let n=-1;for(let k=1;k<=P;k++){const ix=(c+k)%P;if(!pl[ix].done){n=ix;break}}
   if(n<0){over=true;break}c=n;
  }
  return{pl,c,over};
 }
 const pl=T.names.map(n=>({n,att:0,ok:0,dt:0}));
 for(let i=0;i<T.log.length;i++){const e=T.log[i],q=pl[i%P];q.att++;if(e.r){q.ok++;q.dt+=e.r}}
 return{pl,c:T.log.length%P,over:T.log.length>=T.o.n*P};
}

 return `<div style="display:grid;grid-template-columns:repeat(${Math.min(4,st.pl.length)},1fr);gap:8px;margin-bottom:10px">${st.pl.map((q,i)=>{
  const act=!st.over&&i==st.c;
  let a="",b="";
  if(TN.k=="atc"){a=q.done?"✔":trTgt(q.pos);b=trDts(q.dt)}
  else if(TN.k=="sh"){a=q.sc;b=q.sh?q.sh+"× Shanghai":T("Forduló")+" "+Math.min(st.rnd,TN.o.sr)+"/"+TN.o.sr}
  else if(TN.k=="b27"){a=q.out?"✖":q.sc;b=q.done?T("kész"):"D"+(q.r>=20?"Bull":q.r+1)}
  else{a=q.ok+"/"+q.att;b=q.att?Math.round(100*q.ok/q.att)+"%":"–"}
  return `<div class="c" style="margin:0;padding:8px;text-align:center;border:2px solid ${act?"var(--ac)":"transparent"}"><div class="hist" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.n)}</div><div style="font-size:24px;font-weight:700">${a}</div><div class="hist" style="margin:0">${b}</div></div>`}).join("")}</div>`;
}

function trEnd(st,head){
 const T0=TN;let rows="",win="";
 let res=st.pl.map((q,i)=>{
  if(T0.k=="atc")return{n:q.n,val:q.done?q.dt:null,txt:q.done?trDts(q.dt):"–",rank:q.done?q.dt:1e9};
  if(T0.k=="sh"){const w=st.win==i;return{n:q.n,val:w?null:q.sc,txt:q.sc+" "+T("pont")+(q.sh?" · "+q.sh+"× Shanghai":""),rank:w?-1e9:-q.sc}}
  if(T0.k=="b27")return{n:q.n,val:q.sc,txt:(q.out?"✖ ":"")+q.sc+" "+T("pont"),rank:-q.sc};
  const p=q.att?100*q.ok/q.att:0;return{n:q.n,val:p,txt:q.ok+"/"+q.att+" · "+Math.round(p)+"%"+(q.ok?" · ⌀ "+(q.dt/q.ok).toFixed(1)+" "+(LANG=="hu"?"nyíl":"darts"):""),rank:-p};
 });
 // rekordok mentése
 const id=trKey(T0);
 if(!T0.saved){
  T0.saved=true;const all=trLoad();T0.newRec={};
  res.forEach(r=>{
   if(r.val==null||(T0.k=="co"&&T0.o.n<10))return;
   const rec={ts:Date.now(),k:T0.k,id,n:r.n,val:r.val};
   const prev=all.filter(x=>x.id==id&&x.n==r.n);
   if(!prev.length||prev.every(x=>trBetter(rec,x)))T0.newRec[r.n]=prev.length?1:2;
   all.push(rec);
  });
  const keep=[];const cnt={};
  all.sort((a,b)=>b.ts-a.ts).forEach(x=>{const kk=x.id+"|"+x.n;cnt[kk]=(cnt[kk]||0)+1;if(cnt[kk]<=20)keep.push(x)});
  trSave(keep);
 }
 const ord=[...res.keys()].sort((a,b)=>res[a].rank-res[b].rank);
 const top=res[ord[0]];
 if(st.win>=0)win="🏆 "+esc(T0.names[st.win])+" – Shanghai!";else if(res.length>1&&top.rank<1e9){const tie=res.filter(r=>r.rank==top.rank).length>1;win=tie?"🤝 Döntetlen":"🏆 "+esc(top.n)}
 rows=ord.map((i,k)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd,#0002)"><span>${res.length>1?(k+1)+". ":""}<b>${esc(res[i].n)}</b>${T0.newRec[res[i].n]==1?" 🏅":""}</span><span>${res[i].txt}</span></div>`).join("");
 $.innerHTML=head+`<div class="c" style="text-align:center"><div style="font-size:40px">${win?"":"🎯"}</div>${win?`<h2 style="margin:6px 0">${win}</h2>`:`<h2 style="margin:6px 0">Edzés vége</h2>`}</div>
 <div class="c" style="margin-top:12px;padding-top:6px">${rows}${Object.values(T0.newRec).some(x=>x==1)?`<div class="hist" style="margin-top:8px">🏅 Új egyéni rekord!</div>`:""}</div>
 <div class="row" style="margin-top:12px"><button class="b pri" onclick="trAgain()">🔁 Újra</button><button class="b" onclick="TN=null;trSetup()">Kilépés</button></div>`;
}

// csoportkör tervezése: csoportok száma, mérete, továbbjutók
function grpPlan(N,gs,adv){
 const G=Math.max(1,Math.ceil(N/gs)),mn=Math.floor(N/G),mx=Math.ceil(N/G),Q=G*adv;
 let err="";
 if(N<3)err="";
 else if(mn<2)err="Túl kevés játékos ehhez a csoportmérethez.";
 else if(adv>mn-1)err="A legkisebb csoport "+mn+" fős, ebből legfeljebb "+(mn-1)+" jut tovább.";
 else if(Q<2)err="Legalább 2 játékosnak tovább kell jutnia a kieséses szakaszba.";
 return{G,mn,mx,Q,err};
}
const grpLetter=g=>g<26?String.fromCharCode(65+g):(g+1)+".";
// beírt/beillesztett névlista feldolgozása (soronként, vesszővel, pontosvesszővel vagy tabulátorral elválasztva)
function tourParse(txt){
 const seen=new Set(),out=[];
 String(txt||"").split(/[\n\r,;\t]+/).forEach(x=>{
  let n=x.trim().replace(/^["']+|["']+$/g,"").replace(/^\d+[.)]\s+/,"").trim().slice(0,20);
  if(!n||seen.has(hsNm(n)))return;seen.add(hsNm(n));out.push(n);
 });
 return out;
}
// nevek hozzáadása a listához; visszatér: [hozzáadott, már szereplő, a limit miatt kihagyott]
function tourAddNames(arr){
 const nm=tourNames(),have=new Set(nm.map(hsNm));let add=0,dup=0,over=0;
 for(const n of arr){
  if(have.has(hsNm(n))){dup++;continue}
  if(nm.length>=TMAX){over++;continue}
  nm.push(n);have.add(hsNm(n));add++;
 }
 return[add,dup,over];
}

function tourShuffle(){const a=tourNames();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}tourSetup()}
// körmérkőzés párosításai (körző módszer): [{r,i,a,b}] – a, b: a megadott tömb elemei
function rrPairs(ids){
 const arr=[...ids];if(arr.length%2)arr.push(null);const n=arr.length,out=[];
 for(let r=0;r<n-1;r++){
  for(let k=0;k<n/2;k++){const a=arr[k],b=arr[n-1-k];if(a!=null&&b!=null)out.push({r:r+1,i:k,a,b})}
  arr.splice(1,0,arr.pop());
 }
 return out;
}
// szabványos kiemelési sorrend (1 a 2^k-ból): [1,size,...]
function seedPos(size){let a=[1];while(a.length<size){const n=a.length*2;a=a.flatMap(x=>[x,n+1-x])}return a}
function tourCreate(){

function tourQual(TT){
 const L=[];
 TT.grp.groups.forEach((gr,g)=>tourStand(TT,g).slice(0,TT.grp.adv).forEach((q,rk)=>L.push({i:q.i,g,rk,w:q.w,d:q.lf-q.la,lf:q.lf,n:q.n})));
 L.sort((a,b)=>a.rk-b.rk||b.w-a.w||b.d-a.d||b.lf-a.lf||a.n.localeCompare(b.n));
 return L;

// a kieséses szakasz első köre a továbbjutókból
function tourKoStart(TT,Q){
 const n=Q.length;let size=1;while(size<n)size*=2;TT.grp.kn=size;
 const pos=seedPos(size),pairs=[];
 for(let k=0;k<size/2;k++){const a=Q[pos[2*k]-1],b=pos[2*k+1]-1<n?Q[pos[2*k+1]-1]:null;pairs.push([a,b])}
 // ugyanabból a csoportból érkezők első körös találkozásának elkerülése (egyszerű cserékkel)
 for(let k=0;k<pairs.length;k++){
  const [a,b]=pairs[k];if(!b||a.g!=b.g)continue;
  for(let j=0;j<pairs.length;j++){
   if(j==k||!pairs[j][1])continue;
   const [c,d]=pairs[j];
   if(c.g!=b.g&&a.g!=d.g&&d.rk==b.rk){pairs[k][1]=d;pairs[j][1]=b;break}
  }
 }
 pairs.forEach(([a,b],k)=>TT.matches.push(b?{id:"k1-"+k,ko:1,r:1,i:k,a:a.i,b:b.i,w:-1,sa:null,sb:null}:{id:"k1-"+k,ko:1,r:1,i:k,a:a.i,b:null,w:0,sa:0,sb:0,bye:1}));

// a bajnok és a következő kör újraszámolása – ismételhető, idempotens
function tourRebuild(TT){
 if(TT.fmt=="rr"){
  const st=tourStand(TT);TT.champ=TT.matches.every(m=>m.w>=0)&&st.length?st[0].i:null;return;
 }
 if(TT.fmt=="grp"){
  const gm=TT.matches.filter(m=>m.g!=null);
  if(gm.some(m=>m.w<0)){TT.matches=gm;TT.champ=null;TT.grp.q=[];TT.grp.kn=0;return}
  const Q=tourQual(TT),key=JSON.stringify(Q.map(q=>q.i));
  if(key!=JSON.stringify(TT.grp.q)||!TT.matches.some(m=>m.ko)){TT.matches=gm;TT.grp.q=Q.map(q=>q.i);tourKoStart(TT,Q)}
 }
 let r=1;TT.champ=null;const g=TT.fmt=="grp",pre=g?"k":"";
 const isK=m=>tourIsK(TT,m);
 for(;;){
  const cur=TT.matches.filter(m=>isK(m)&&m.r==r).sort((x,y)=>x.i-y.i);
  if(!cur.length)return;
  if(cur.some(m=>m.w<0)){TT.matches=TT.matches.filter(m=>!isK(m)||m.r<=r);return}
  const win=cur.map(m=>m.w==0?m.a:m.b);
  if(win.length==1){TT.champ=win[0];TT.matches=TT.matches.filter(m=>!isK(m)||m.r<=r);return}
  const nxt=[];for(let k=0;k<win.length;k+=2)nxt.push([win[k],win[k+1]]);
  const ex=TT.matches.filter(m=>isK(m)&&m.r==r+1).sort((x,y)=>x.i-y.i);
  const same=ex.length==nxt.length&&ex.every((m,k)=>m.a==nxt[k][0]&&m.b==nxt[k][1]);
  if(!same){TT.matches=TT.matches.filter(m=>!isK(m)||m.r<=r);nxt.forEach(([a,b],k)=>TT.matches.push(Object.assign({id:pre+(r+1)+"-"+k,r:r+1,i:k,a,b,w:-1,sa:null,sb:null},g?{ko:1}:{})))}
  r++;
 }
}
// tabella: g nélkül az összes játékos (körmérkőzés), g-vel az adott csoport
function tourStand(TT,g){

 ids.forEach(i=>P[i]={i,n:TT.players[i],m:0,w:0,l:0,lf:0,la:0});
 for(const m of TT.matches){if(m.w<0||m.bye)continue;
  if(g==null?(m.g!=null||m.ko):m.g!==g)continue;
  const a=P[m.a],b=P[m.b];if(!a||!b)continue;a.m++;b.m++;a.lf+=m.sa||0;a.la+=m.sb||0;b.lf+=m.sb||0;b.la+=m.sa||0;
  if(m.w==0){a.w++;b.l++}else{b.w++;a.l++}}

}

async function frAct(a,name,after){

 else if(a=="fr_req")toast(r.auto?"🤝 Barátok lettetek!":"Barátkérés elküldve.");
 else if(a=="fr_acc")toast("🤝 Barátok lettetek!");

function frBlockAsk(n,after){popup({icon:"🚫",title:"Játékos tiltása",text:n+" tiltása: nem küldhet neked kérést, üzenetet és kihívást.",btns:[{t:"Tiltás",pri:1,f:()=>frAct("bl_add",n,after)},{t:"Mégse"}]})}

function frStopChat(){clearInterval(FRU.tm);FRU.tm=null;FRU.chat=null}
async function frChatOpen(n){
 if(!AC)return;
 botCancel();G=null;$.className="w";FRU.chat=n;FRU.msgs=[];FRU.txt="";FRU.selMode=false;FRU.sel=new Set();FRU.last=[];
 $.innerHTML=frTop("💬 "+esc(n),"frScreen()")+`<div class="c" style="padding:8px"><div id="frmsgs" style="height:min(55vh,420px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px"></div>
  <div class="pr" style="margin-top:8px"><input class="n" id="frtxt" maxlength="300" placeholder="Írj üzenetet…" oninput="FRU.txt=this.value" onkeydown="if(event.key=='Enter')frSend()"><button class="b pri sm" style="flex:none" onclick="frSend()">Küldés</button></div><div id="frselbar" style="text-align:right;margin-top:6px"></div></div>`;
 clearInterval(FRU.tm);FRU.tm=setInterval(()=>{if(FRU.chat&&!document.hidden)frMsgs()},4000);
 await frMsgs(true);

async function frMsgs(first){
 const n=FRU.chat;if(!n)return;
 const r=await olApi("msg_get",Object.assign({with:n},acTok()));
 if(FRU.chat!=n)return;
 if(r.auth){acDrop();chalStop();frStopChat();return olScreen()}
 if(!r.ok){if(first){errPop(r.err||"Hiba");frScreen()}return}
 const e=document.getElementById("frmsgs");if(!e)return;
 const sig=JSON.stringify(r.msgs);if(FRU.sig===sig&&!first)return;FRU.sig=sig;
 FRU.last=r.msgs;frDraw(first);
 frPoll();
}
function frDraw(first){
 const e=document.getElementById("frmsgs");if(!e)return;const msgs=FRU.last||[];
 const near=first||e.scrollHeight-e.scrollTop-e.clientHeight<60;
 const tm=ts=>{try{return new Date(ts*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}catch(x){return""}};
 e.innerHTML=msgs.length?msgs.map(m=>{const pick=FRU.selMode&&!m.mine,on=FRU.sel&&FRU.sel.has(m.ts);
  return `<div ${pick?`onclick="frTog(${m.ts})"`:""} style="align-self:${m.mine?"flex-end":"flex-start"};max-width:80%;padding:7px 11px;border-radius:14px;${m.mine?"background:var(--ac);color:#fff":"background:var(--bg);border:1px solid var(--bd,#0003)"}${pick?";cursor:pointer;outline:2px "+(on?"solid var(--bad,#e5484d)":"dashed var(--bd,#888)"):""}${on?";background:#e5484d22":""}"><div style="white-space:pre-wrap;word-break:break-word">${esc(m.t)}</div><div style="font-size:11px;opacity:.7;text-align:right">${tm(m.ts)}</div></div>`}).join(""):`<div class="hist" style="text-align:center;margin:auto">Még nincs üzenet. Írj valamit!</div>`;
 if(near)e.scrollTop=e.scrollHeight;
 frSelBar();
}
function frSelBar(){
 const b=document.getElementById("frselbar");if(!b)return;
 b.innerHTML=FRU.selMode?`<div class="hist" style="margin:0 0 6px;text-align:left"><b>Jelöld meg a sértő üzenetet</b> (koppints rá, legfeljebb 5): ${FRU.sel.size||"nincs"} kiválasztva</div><div class="row"><button class="b sm" onclick="frSelMode()">Mégse</button><button class="b sm pri" ${FRU.sel.size?"":"disabled"} onclick="repOpen(FRU.chat,1,[...FRU.sel])">Tovább</button></div>`:`<button class="b sm" onclick="frSelMode()">🚩 Jelentés</button>`;
}
function frSelMode(){FRU.selMode=!FRU.selMode;FRU.sel=new Set();frDraw(false)}
function frTog(ts){if(FRU.sel.has(ts))FRU.sel.delete(ts);else if(FRU.sel.size<5)FRU.sel.add(ts);frDraw(false)}
async function frSend(){
 const t=(FRU.txt||"").trim();if(!t||!FRU.chat)return;
 const i=document.getElementById("frtxt");FRU.txt="";if(i){i.value="";i.focus()}
 const r=await olApi("msg_send",Object.assign({to:FRU.chat,text:t},acTok()));

 if(!r.ok){errPop(r.err||"Hiba");FRU.txt=t;if(i)i.value=t;return}

 FRU.sig="";frMsgs(true);

aten?"],["Helyi játéknál minden adat (beállítások, megkezdett és befejezett meccsek, statisztika) csak ebben a böngészőben, ezen a készüléken van. Ha törlöd a böngésző adatait, vagy másik eszközre váltasz, ezek nem lesznek meg.","In local play all data (settings, started and finished matches, statistics) stays only in this browser on this device. If you clear the browser data or switch to another device, it will not be there.","Beim lokalen Spiel liegen alle Daten (Einstellungen, begonnene und beendete Spiele, Statistik) nur in diesem Browser auf diesem Gerät. Wenn du die Browserdaten löschst oder das Gerät wechselst, sind sie nicht mehr da."],["Regisztrált fiókkal a befejezett meccseid előzménye a szerverre is mentődik, így más eszközön is elérhető. A beállítások és a félbehagyott meccs nem szinkronizálódik.","With an account, the history of your finished matches is also saved on the server, so it is available on other devices. Settings and an unfinished match are not synced.","Mit einem Konto wird der Verlauf deiner beendeten Spiele auch auf dem Server gespeichert und ist so auf anderen Geräten verfügbar. Einstellungen und ein unterbrochenes Spiel werden nicht synchronisiert."],["játékos online","players online","Spieler online"],["Játékos jelentése","Report a player","Spieler melden"],["Megjegyzés (nem kötelező)","Note (optional)","Anmerkung (optional)"],["Jelentés küldése","Send report","Meldung senden"],["🚩 Jelentés","🚩 Report","🚩 Melden"],["Sértő név","Offensive name","Beleidigender Name"],["Sértő üzenet","Offensive message","Beleidigende Nachricht"],["Csalás","Cheating","Betrug"],["Zaklatás","Harassment","Belästigung"],["Egyéb","Other","Sonstiges"],["Köszönjük","Thank you","Danke"],["A jelentést megkaptuk, a moderátor megnézi.","We received your report; the moderator will look at it.","Wir haben deine Meldung erhalten; der Moderator sieht sie sich an."],["Ezt a játékost már jelentetted, a jelentés még függőben van.","You have already reported this player; the report is still pending.","Du hast diesen Spieler bereits gemeldet; die Meldung ist noch offen."],["Fiók törlése","Delete account","Konto löschen"],["🗑 Fiók törlése","🗑 Delete account","🗑 Konto löschen"],["Ha már nem szeretnéd használni a fiókodat, véglegesen törölheted.","If you no longer want to use your account, you can delete it permanently.","Wenn du dein Konto nicht mehr nutzen möchtest, kannst du es endgültig löschen."],["A fiókod, a barátaid, az üzeneteid és a kihívásaid véglegesen törlődnek a szerverről. A ranglistán a korábbi meccseid névtelenül („Törölt játékos”) megmaradnak az ellenfeleid pontszáma miatt. A készülékeden lévő meccselőzmények megmaradnak. Ez nem vonható vissza.","Your account, friends, messages and challenges will be permanently deleted from the server. On the leaderboard your past matches stay anonymously (“Deleted player”) so your opponents’ ratings do not change. The match history on your device stays. This cannot be undone.","Dein Konto, deine Freunde, Nachrichten und Herausforderungen werden dauerhaft vom Server gelöscht. In der Rangliste bleiben deine bisherigen Spiele anonym („Gelöschter Spieler“), damit sich die Wertung deiner Gegner nicht ändert. Der Spielverlauf auf deinem Gerät bleibt erhalten. Das kann nicht rückgängig gemacht werden."],["Jelszavad a megerősítéshez","Your password to confirm","Dein Passwort zur Bestätigung"],["Fiók végleges törlése","Delete account permanently","Konto endgültig löschen"],["A fiókod törölve lett.","Your account has been deleted.","Dein Konto wurde gelöscht."],["Néhány szó ki lett takarva.","Some words were masked.","Einige Wörter wurden verdeckt."],["Ez a név nem használható.","This name cannot be used.","Dieser Name kann nicht verwendet werden."],["A fiókodat ideiglenesen felfüggesztették.","Your account has been temporarily suspended.","Dein Konto wurde vorübergehend gesperrt."],["A fiókodat a moderátor letiltotta.","Your account has been blocked by the moderator.","Dein Konto wurde vom Moderator gesperrt."],["Ma már elérted a jelentések maximális számát.","You have reached today's maximum number of reports.","Du hast heute die maximale Anzahl an Meldungen erreicht."],["Magadat nem jelentheted.","You cannot report yourself.","Du kannst dich nicht selbst melden."],["Névjegy","About","Info"],["Verzió","Version","Version"],["🌐 Online profil hozzáadása","🌐 Add online profile","🌐 Online-Profil hinzufügen"],["Online profil hozzáadása","Add online profile","Online-Profil hinzufügen"],["A játékos jelentkezzen be a saját fiókjával. A meccs eredménye és az átlagai így az ő profiljába is bekerülnek.","The player should sign in with their own account. The match result and averages will then be saved to their profile too.","Der Spieler meldet sich mit seinem eigenen Konto an. Ergebnis und Durchschnitte werden dann auch in seinem Profil gespeichert."],["A bejelentkezés ezen az eszközön megmarad, amíg le nem választod.","The sign-in stays on this device until you unlink it.","Die Anmeldung bleibt auf diesem Gerät, bis du sie trennst."],["Hozzáadás","Add","Hinzufügen"],["profilja össze van kötve","profile is linked","Profil ist verbunden"],["Leválasztás","Unlink","Trennen"],["Leválasztva.","Unlinked.","Getrennt."],["Ezzel a fiókkal már be vagy jelentkezve.","You are already signed in with this account.","Mit diesem Konto bist du bereits angemeldet."],["a bejelentkezés lejárt, kösd össze újra.","sign-in expired, link again.","Anmeldung abgelaufen, bitte neu verbinden."],["🛡 Admin felület","🛡 Admin panel","🛡 Admin-Bereich"],["Nincs meg a kód?","Don't have the code?","Kein Code vorhanden?"],["Add meg fent a neved, és kérj új jelszót az admintól. Ő beállít egyet, és átadja neked.","Enter your name above and ask the admin for a new password. They will set one and pass it to you.","Gib oben deinen Namen ein und bitte den Admin um ein neues Passwort. Er setzt eines und gibt es dir weiter."],["🔑 Új jelszót kérek az admintól","🔑 Ask the admin for a new password","🔑 Neues Passwort beim Admin anfordern"],["Kérés elküldve","Request sent","Anfrage gesendet"],["Ha van ilyen nevű fiók, az admin látja a kérésed. Miután beállított neked egy új jelszót, ő adja át – utána be tudsz lépni vele, és a Fiók oldalon átírhatod a sajátodra.","If an account with this name exists, the admin will see your request. Once they set a new password for you, they will pass it on – then you can sign in with it and change it to your own on the Account page.","Falls es ein Konto mit diesem Namen gibt, sieht der Admin deine Anfrage. Sobald er ein neues Passwort gesetzt hat, gibt er es dir weiter – damit kannst du dich anmelden und es auf der Konto-Seite ändern."],["Online fiók létrehozása","Create online account","Online-Konto erstellen"],["Válassz jelszót. Az eredményei és átlagai ezután az online fiókjába is bekerülnek. E-mail cím nem kell.","Choose a password. Their results and averages will then be saved to the online account too. No e-mail address needed.","Wähle ein Passwort. Ergebnisse und Durchschnitte werden dann auch im Online-Konto gespeichert. Keine E-Mail-Adresse nötig."],["Létrehozás","Create","Erstellen"],["Jelszó még egyszer","Repeat password","Passwort wiederholen"],["Jelszó (legalább 6 karakter)","Password (at least 6 characters)","Passwort (mindestens 6 Zeichen)"],["Helyreállító kód","Recovery code","Wiederherstellungscode"],["🌐 Online fiók · be vagy jelentkezve","🌐 Online account · signed in","🌐 Online-Konto · angemeldet"],["🌐 Online fiók · összekötve","🌐 Online account · linked","🌐 Online-Konto · verbunden"],["🌐 Online fiók · nincs összekötve","🌐 Online account · not linked","🌐 Online-Konto · nicht verbunden"],["💾 Csak helyi · nincs online fiókja","💾 Local only · no online account","💾 Nur lokal · kein Online-Konto"],["Összekötés","Link","Verbinden"],["Fiók felfüggesztve","Account suspended","Konto gesperrt"],["Fellebbezés","Appeal","Einspruch"],["Bezár","Close","Schließen"],["Fellebbezés elküldve","Appeal sent","Einspruch gesendet"],["Az admin hamarosan megnézi. Ha feloldják a felfüggesztést, újra be tudsz lépni.","The admin will review it soon. If the suspension is lifted, you can sign in again.","Der Admin prüft es in Kürze. Wird die Sperre aufgehoben, kannst du dich wieder anmelden."],["Írd le, miért gondolod, hogy tévedés történt.","Explain why you think this was a mistake.","Erkläre, warum du das für einen Irrtum hältst."],["Írd le, miért gondolod, hogy a felfüggesztés tévedés volt. Az admin megnézi, és értesít a döntésről.","Explain why you think the suspension was a mistake. The admin will review it and let you know.","Erkläre, warum du die Sperre für einen Irrtum hältst. Der Admin prüft es und informiert dich."],["Fellebbezésed szövege","Your appeal","Text deines Einspruchs"],["Online fiók (összekötve)","Online account (linked)","Online-Konto (verbunden)"],["Online fiók (nincs összekötve)","Online account (not linked)","Online-Konto (nicht verbunden)"],["Csak helyi játékos","Local player only","Nur lokaler Spieler"],["🛡 Admin","🛡 Admin","🛡 Admin"],["Mentett játékosok","Saved players","Gespeicherte Spieler"],["Nincs bejelentkezve","Not signed in","Nicht angemeldet"],["Nincs összekötve online profillal:","Not linked to an online profile:","Nicht mit einem Online-Profil verbunden:"],["Az eredmények és az átlagok csak ezen az eszközön maradnak. Jelentkezz be az online fiókoddal, hogy szinkronizálódjanak.","Results and averages stay on this device only. Sign in with your online account to sync them.","Ergebnisse und Durchschnitte bleiben nur auf diesem Gerät. Melde dich mit deinem Online-Konto an, damit sie synchronisiert werden."],["Indítás így","Start anyway","So starten"],["Indítás, és ne kérdezd többet","Start, and don't ask again","Starten und nicht mehr fragen"],["Kieséses: a vesztes kiesik. Ha nem páros a létszám, páran szabadnapot kapnak az első körben.","Knockout: the loser is out. If the number of players is odd, some get a bye in the first round.","K.-o.-System: Der Verlierer scheidet aus. Bei ungerader Spielerzahl bekommen einige in der ersten Runde ein Freilos."],["Csoportkör + kieséses","Group stage + knockout","Gruppenphase + K.-o.-Runde"],["Csoportkör: a játékosok csoportokba kerülnek, a csoporton belül mindenki mindenkivel játszik egyszer. A csoportok legjobbjai jutnak tovább a kieséses szakaszba.","Group stage: players are split into groups and everyone plays everyone in their group once. The best of each group advance to the knockout stage.","Gruppenphase: Die Spieler werden in Gruppen eingeteilt, in der Gruppe spielt jeder einmal gegen jeden. Die Besten jeder Gruppe kommen in die K.-o.-Phase."],["Csoportok mérete","Group size","Gruppengröße"],["Csoportonként tovább jut","Advance per group","Aufsteiger pro Gruppe"],["Sorsolás","Draw","Auslosung"],["Véletlen","Random","Zufällig"],["A lista sorrendje (kiemelés)","List order (seeding)","Reihenfolge der Liste (Setzung)"],["A párosítást és a csoportokat a program sorsolja.","The pairings and groups are drawn by the app.","Paarungen und Gruppen werden von der App ausgelost."],["A lista elején lévők a kiemeltek: a legjobbak külön csoportba kerülnek, illetve a kieséses ágon később találkoznak.","Those at the top of the list are seeded: the best go into separate groups and meet later in the knockout bracket.","Wer oben in der Liste steht, ist gesetzt: Die Besten kommen in getrennte Gruppen bzw. treffen später im K.-o.-Baum aufeinander."],["csoport","group","Gruppe"],["fős","players","Spieler"],["játékos jut a kieséses szakaszba","players reach the knockout stage","Spieler erreichen die K.-o.-Phase"],["legalább 3","at least 3","mindestens 3"],["Név hozzáadása","Add a name","Namen hinzufügen"],["📋 Importálás","📋 Import","📋 Importieren"],["Illessz be egy névlistát (soronként egy név, vagy vesszővel, pontosvesszővel elválasztva – pl. Excelből), vagy tölts be egy .txt / .csv fájlt.","Paste a list of names (one per line, or separated by commas or semicolons – e.g. from Excel), or load a .txt / .csv file.","Füge eine Namensliste ein (ein Name pro Zeile oder durch Komma/Semikolon getrennt – z. B. aus Excel) oder lade eine .txt-/.csv-Datei."],["Hozzáadás a listához","Add to the list","Zur Liste hinzufügen"],["📄 Fájl betöltése","📄 Load file","📄 Datei laden"],["Még nincs játékos a listán.","No players on the list yet.","Noch keine Spieler in der Liste."],["🔀 Keverés","🔀 Shuffle","🔀 Mischen"],["Lista törlése","Clear list","Liste löschen"],["Mind kijelölése","Select all","Alle auswählen"],["Kijelölés törlése","Clear selection","Auswahl aufheben"],["Nincs több mentett játékos.","No more saved players.","Keine weiteren gespeicherten Spieler."],["👥 Mentett játékos hozzáadása","👥 Add a saved player","👥 Gespeicherten Spieler hinzufügen"],["játékos hozzáadva","players added","Spieler hinzugefügt"],["már szerepelt","already on the list","standen schon in der Liste"],["a limit miatt kimaradt","skipped because of the limit","wegen des Limits ausgelassen"],["A fájlt nem lehet beolvasni.","The file could not be read.","Die Datei konnte nicht gelesen werden."],["Ez a név már szerepel.","This name is already on the list.","Dieser Name steht schon in der Liste."],["A kieséses szakaszban már vannak lejátszott meccsek.","There are already played matches in the knockout stage.","In der K.-o.-Phase gibt es bereits gespielte Spiele."],["Túl kevés játékos ehhez a csoportmérethez.","Too few players for this group size.","Zu wenige Spieler für diese Gruppengröße."],["Legalább 2 játékosnak tovább kell jutnia a kieséses szakaszba.","At least 2 players must advance to the knockout stage.","Mindestens 2 Spieler müssen in die K.-o.-Phase aufsteigen."],["meccs","matches","Spiele"],["Klub:","Club:","Verein:"],["Készült a Claude segítségével.","Made with the help of Claude.","Entstanden mit Hilfe von Claude."],["Adatkezelés és sütik","Privacy and cookies","Datenschutz und Cookies"],["Az alkalmazás nem használ sütiket, nem követ nyomon, és nincs benne reklám – a jövőben sem lesz.","The app uses no cookies, does not track you and contains no ads – and it never will.","Die App verwendet keine Cookies, verfolgt dich nicht und enthält keine Werbung – und das bleibt auch so."],["A beállításaid, a mentett meccseid és a statisztikád csak a készülékeden, a böngésző helyi tárolójában vannak (ez a működéshez szükséges, ezért nem kér hozzájárulást).","Your settings, saved matches and statistics are kept only on your device, in the browser's local storage (this is needed for the app to work, so no consent is required).","Deine Einstellungen, gespeicherten Spiele und Statistiken liegen nur auf deinem Gerät im lokalen Speicher des Browsers (das ist für die Funktion nötig, daher ist keine Zustimmung erforderlich)."],["Online játéknál és fiók használatakor a szerver megőrzi a neved, a meccseidet és az üzeneteidet. A jelszavadat nem tároljuk: csak egy visszafejthetetlen változatát, így azt senki sem tudja elolvasni. Adatot nem adunk tovább, és semmire nem használjuk fel. Fiókot nem kötelező létrehozni.","When you play online or use an account, the server keeps your name, your matches and your messages. We do not store your password itself, only an irreversible scrambled version of it, so nobody can read it. We do not pass data on to anyone or use it for anything else. Creating an account is optional.","Beim Online-Spielen oder mit einem Konto speichert der Server deinen Namen, deine Spiele und Nachrichten. Dein Passwort selbst speichern wir nicht, nur eine nicht umkehrbare, verschlüsselte Form davon, die niemand lesen kann. Wir geben keine Daten weiter und nutzen sie für nichts anderes. Ein Konto ist freiwillig."],["Előny (handicap)","Advantage (handicap)","Vorgabe (Handicap)"],["Nincs","None","Keine"],["Van","Yes","Ja"],["Cricket: add meg, hány jelölést kapjon előre az adott játékos (pl. 3 = egy teljes számot).","Cricket: enter how many marks each player gets in advance (e.g. 3 = one full number).","Cricket: gib an, wie viele Marks jeder Spieler vorab bekommt (z. B. 3 = eine ganze Zahl)."],["X01: add meg az egyes játékosok kezdőpontját, hogy kiegyenlítettebb legyen a meccs (pl. 501 helyett 401 az egyik félnek). Üresen a játékmód pontja marad.","X01: enter each player's starting score to even out the match (e.g. 401 instead of 501 for one side). Empty keeps the game mode's score.","X01: gib den Startwert jedes Spielers an, um das Spiel auszugleichen (z. B. 401 statt 501 für eine Seite). Leer = Wert des Spielmodus."],["Ez a böngésző / eszköz nem engedi a rezgést.","This browser / device does not allow vibration.","Dieser Browser / dieses Gerät unterstützt keine Vibration."],["Kilépés a teljes képernyőből","Exit full screen","Vollbild beenden"],["Teljes képernyő","Full screen","Vollbild"],["Automatikus","Automatic","Automatisch"],["Világos","Light","Hell"],["Sötét","Dark","Dunkel"],["Vizuális visszajelzés","Visual feedback","Visuelles Feedback"],["gombnyomás és bust villanás","button press and bust flash","Tastendruck und Bust-Blitz"],["Rezgés","Vibration","Vibration"],["gombnyomáskor","on button press","beim Tastendruck"],["Rezgés a bot dobásainál","Vibration on bot throws","Vibration bei Bot-Würfen"],["minden nyíl becsapódásakor","on every dart hit","bei jedem Dart-Treffer"],["Billentyűzet","Keyboard","Tastatur"],["⌨ Gyorsbillentyűk (H)","⌨ Keyboard shortcuts (H)","⌨ Tastenkürzel (H)"],["Játék","Game","Spiel"],["📊 Eddigi statisztika","📊 Statistics so far","📊 Bisherige Statistik"],["💾 Mentés és kilépés","💾 Save and exit","💾 Speichern und beenden"],["⚙ Beállítások","⚙ Settings","⚙ Einstellungen"],["Vissza","Back","Zurück"],["Megjelenés","Appearance","Darstellung"],["Visszajelzés","Feedback","Feedback"],["A teljes képernyő itt nem engedélyezett. Nyisd meg az oldalt külön lapon, iPhone-on pedig add hozzá a főképernyőhöz.","Full screen is not allowed here. Open the page in its own tab, or on iPhone add it to the home screen.","Der Vollbildmodus ist hier nicht erlaubt. Öffne die Seite in einem eigenen Tab, auf dem iPhone füge sie zum Home-Bildschirm hinzu."],["🎲 Véletlen","🎲 Random","🎲 Zufall"],["Játékos 1","Player 1","Spieler 1"],["Játékos {}","Player {}","Spieler {}"],["Pont nélküli","No points","Ohne Punkte"],["Pont nélkül","No points","Ohne Punkte"],["Egyéni","Custom","Individuell"],["Csapatjáték (2v2)","Team game (2v2)","Teamspiel (2v2)"],["1. és 3. játékos egy csapat, a 2. és 4. a másik","Players 1 and 3 form one team, 2 and 4 the other","Spieler 1 und 3 bilden ein Team, 2 und 4 das andere"],["Pontozás","Scoring","Wertung"],["Számok","Numbers","Zahlen"],["Standard: a lezárt számra dobott többletért pontot kapsz, amíg az ellenfél még nem zárta le; nyer, aki mindent lezárt és nem áll pontban hátrább.","Standard: extra hits on a closed number score points as long as your opponent has not closed it; you win by closing everything without trailing on points.","Standard: Zusätzliche Treffer auf eine geschlossene Zahl bringen Punkte, solange der Gegner sie nicht geschlossen hat; es gewinnt, wer alles geschlossen hat und punktemäßig nicht zurückliegt."],["Cut-throat: a többletpontot nem te kapod, hanem az ellenfelek, akik még nem zárták le a számot; nyer, aki mindent lezárt és a legkevesebb pontja van.","Cut-throat: extra points go to your opponents who have not closed the number; you win by closing everything with the lowest score.","Cut-throat: Die Zusatzpunkte erhalten nicht Sie, sondern die Gegner, die die Zahl noch nicht geschlossen haben; es gewinnt, wer alles geschlossen hat und die wenigsten Punkte hat."],["Pont nélküli: nincs pontszerzés, az nyer, aki először lezárja az összes számot.","No points: there is no scoring; the first player to close all numbers wins.","Ohne Punkte: Es gibt keine Punkte; es gewinnt, wer zuerst alle Zahlen schließt."],["Szimpla","Single","Single"],["Dupla","Double","Double"],["Szimpla beszálló: bármilyen találat elindítja a pontszámlálást.","Single in: any hit starts the scoring.","Single In: Jeder Treffer startet die Punktezählung."],["Dupla beszálló: a pontok csak az első dupla találattól számítanak.","Double in: points only count from the first double hit.","Double In: Die Punkte zählen erst ab dem ersten Doppeltreffer."],["Master beszálló: az első dupla vagy tripla találattól számítanak a pontok.","Master in: points count from the first double or triple hit.","Master In: Die Punkte zählen ab dem ersten Doppel- oder Triple-Treffer."],["Szimpla kiszálló: bármilyen találattal be lehet fejezni, ha pontosan 0-ra jön ki.","Single out: you can finish with any hit if it reaches exactly 0.","Single Out: Mit jedem Treffer beenden, wenn genau 0 erreicht wird."],["Dupla kiszálló: a leget dupla találattal kell befejezni (a 0 előtt az 1 nem jó).","Double out: the leg must be finished with a double hit (leaving 1 before 0 is not allowed).","Double Out: Das Leg muss mit einem Doppeltreffer beendet werden (die 1 vor der 0 ist nicht möglich)."],["Master kiszálló: a leget dupla vagy tripla találattal kell befejezni (a 0 előtt az 1 nem jó).","Master out: the leg must be finished with a double or triple hit (leaving 1 before 0 is not allowed).","Master Out: Das Leg muss mit einem Doppel- oder Triple-Treffer beendet werden (die 1 vor der 0 ist nicht möglich)."],["Beszálló","In","Einstieg"],["Kiszálló","Out","Ausstieg"],["Játék típusa","Game type","Spielart"],["Játékmód (kezdőpont)","Game mode (starting score)","Spielmodus (Startpunktzahl)"],["Legek száma (szettenként, győzelemhez {} leg kell)","Number of legs (per set, {} legs needed to win)","Anzahl der Legs (pro Set, {} Legs zum Sieg)"],["Szettek száma (győzelemhez {} szett kell)","Number of sets ({} sets needed to win)","Anzahl der Sets ({} Sets zum Sieg)"],["Cricketben legfeljebb 4 játékos lehet.","Cricket allows at most 4 players.","Beim Cricket sind höchstens 4 Spieler möglich."],["várható MPR ~{}","expected MPR ~{}","erwarteter MPR ~{}"],["várható átlag ~{}","expected average ~{}","erwarteter Durchschnitt ~{}"],["+ Játékos hozzáadása","+ Add player","+ Spieler hinzufügen"],["👤 Játékos hozzáadása","👤 Add pla rben három nyilat dobsz a következő duplára (D1, D2 … D20, Bull). Találatonként a dupla értékét kapod, ha mindhárom mellé megy, annyit levonnak. Ha a pontod 0 vagy az alá esik, vége.","You start with 27 points. Each round you throw three darts at the next double (D1, D2 … D20, Bull). You gain the double's value for each hit; if all three miss, that value is deducted. If your score reaches 0 or below, you're out.","Du startest mit 27 Punkten. In jeder Runde wirfst du drei Darts auf das nächste Doppel (D1, D2 … D20, Bull). Für jeden Treffer bekommst du den Wert des Doppels, bei drei Fehlwürfen wird er abgezogen. Bei 0 Punkten oder weniger ist das Spiel vorbei."],["Véletlen kiszálló-számokat kapsz: mondd meg, sikerült-e három nyílból befejezni. A végén megkapod a sikerességed.","You get random checkout numbers: tell whether you managed to finish with three darts. At the end you see your success rate.","Du bekommst zufällige Checkout-Zahlen: gib an, ob du mit drei Darts ausgecheckt hast. Am Ende siehst du deine Erfolgsquote."],["Szabály","Rule","Regel"],["Dupla/tripla előre ugrik","Double/triple jumps ahead","Doppel/Triple springt vor"],["Minden találat 1 lépés","Every hit is 1 step","Jeder Treffer ist 1 Schritt"],["Számtartomány","Number range","Zahlenbereich"],["Mind","All","Alle"],["Kísérletek száma játékosonként","Attempts per player","Versuche pro Spieler"],["Útvonal-tipp","Route hint","Routen-Tipp"],["Látszik","Shown","Sichtbar"],["Rejtve","Hidden","Versteckt"],["🏅 Rekordok","🏅 Records","🏅 Rekorde"],["pont","points","Punkte"],["kész","done","fertig"],["Cél","Target","Ziel"],["Nyíl","Dart","Dart"],["✔ Találat","✔ Hit","✔ Treffer"],["✖ Mellé","✖ Miss","✖ Daneben"],["Pont","Score","Punkte"],["Találat értéke","Hit value","Trefferwert"],["Hány nyíl talált a három közül?","How many of the three darts hit?","Wie viele der drei Darts haben getroffen?"],["Kísérlet","Attempt","Versuch"],["Tipp: ","Hint: ","Tipp: "],["✖ Nem sikerült","✖ Failed","✖ Nicht geschafft"],["⏭ Másik
