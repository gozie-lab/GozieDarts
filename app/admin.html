<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>GozieDarts – admin</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#d1d5db;--ac:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#1a2029;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2d3643}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px 14px 60px}h1{font-size:22px;margin:10px 0}h2{font-size:17px;margin:0 0 8px}
.top{display:flex;align-items:center;gap:8px}.top h1{flex:1;margin:10px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input[type=text],input[type=password],input[type=search]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=color]{width:56px;height:42px;padding:2px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 15px system-ui;cursor:pointer}
a.btn{display:inline-block;padding:7px 10px;border-radius:10px;font:600 14px system-ui;text-decoration:none;color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}button.s{padding:7px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;margin:6px 0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;white-space:nowrap;padding:10px 12px;font-size:14px}.tabs button:not(.on){background:transparent;color:var(--tx);border:1px solid var(--bd)}
.u{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);flex-wrap:wrap}.u:first-child{border-top:0}.u .n{flex:1;min-width:130px;word-break:break-word}
.m{color:var(--mut);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ac)}.badge{font-size:12px;padding:2px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.res{font:700 22px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-align:center;margin:10px 0;user-select:all;word-break:break-all}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}.ov .c{max-width:420px;width:100%;margin:0}
a.ul{color:var(--tx);text-decoration:underline}
button{min-height:42px;box-shadow:0 3px 0 rgba(0,0,0,.18)}button.g,button.s.g{box-shadow:none}button.s{min-height:36px}
.bk{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:24px;text-decoration:none;flex:none}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.kt{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--tx);box-shadow:none;min-height:0;font-weight:400}
.kt b{display:block;font-size:22px}.kt span{display:block;font-size:12px;color:var(--mut)}.kt.hot{border-color:var(--bad)}.kt.hot b{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;min-height:0;box-shadow:none;font-weight:400}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details.c>summary{cursor:pointer;font-weight:600;list-style:none}details.c>summary::-webkit-details-marker{display:none}details.c>summary::after{content:"▾";float:right;color:var(--mut)}
.pv{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed var(--bd);border-radius:12px;margin:8px 0}.pv img{height:32px;width:32px;object-fit:contain;border-radius:6px}.pv b{font-size:18px;flex:1}.pv span{background:var(--ac);color:#fff;border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.mn button{display:block;width:100%;margin:6px 0;text-align:left}
@media(max-width:420px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:7}
.bn button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;color:var(--mut);box-shadow:none;border-radius:0;min-height:60px;padding:8px 2px 6px;font:600 12px system-ui}
.bn button i{font-style:normal;font-size:22px;line-height:1.1}.bn button.on{color:var(--ac)}.bn button.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.bn em{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/18px system-ui;font-style:normal;text-align:center;display:none}
.w{padding-bottom:96px}#toast{bottom:84px}
.u{cursor:pointer;padding:12px 0;min-height:60px}.u .dots{width:44px;min-height:44px;font-size:20px;padding:0}.u .n b{font-size:17px}
.c>.row>button.s{flex:1 1 auto;min-height:44px}
.btn2{display:block;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:600;margin:6px 0}
.mn select{width:100%;margin:2px 0 6px;min-height:44px}
input[type=search],input[type=text],input[type=password]{min-height:46px;font-size:16px}
.chips button{min-height:40px;padding:8px 16px}
@media(min-width:760px){.bn{left:50%;right:auto;width:720px;transform:translateX(-50%);border:1px solid var(--bd);border-bottom:0;border-radius:14px 14px 0 0}}

 $.innerHTML=`<div class="top"><h1>🎯 GozieDarts · admin</h1>${langSel()}</div><form class="c" id="lf">${msg?`<p class="bad">${esc(msg)}</p>`:""}<label>Admin neve</label><input type="text" id="ln" autocomplete="username"><label>Jelszó</label><input type="password" id="lp" autocomplete="current-password"><div style="margin-top:14px"><button type="submit">Belépés</button></div></form>`;langBind();
 document.getElementById("lf").onsubmit=async e=>{e.preventDefault();
  const r=await api("login",{name:document.getElementById("ln").value,pw:document.getElementById("lp").value});
  if(!r.ok)return login(r.err||"Hiba");
  if(!r.admin)return login("Ez a fiók nem adminisztrátor.");
  A={name:r.name,token:r.token};saveA();
  start()}
}
async function start(){
 const me=await api("me");
 if(!me||!me.ok){A=null;return login(me&&me.auth?"":(me&&me.err)||"")}
 if(!me.admin){A=null;return login("Ez a fiók nem adminisztrátor, ezért a játékban bejelentkezve marad. Jelentkezz be admin fiókkal.")}
 const c=await api("cfg");if(c&&c.ok){CLUB=c;if(c.color)document.documentElement.style.setProperty("--ac",c.color)}
 render();cnt()
}

 <div id="tb"></div><nav class="bn">${tabs.map(([k,ic,l])=>`<button data-t="${k}" class="${TAB==k?"on":""}"><i>${ic}</i><span>${l}</span><em class="bd0"></em></button>`).join("")}</nav>`;
 document.getElementById("mn").onclick=()=>{const d=dlg(`<h2>Menü</h2><div class="mn"><label>Nyelv / Language / Sprache</label>${langSel()}<a class="btn2" href="index.html">← Vissza a játékhoz</a><button class="g" id="lo" title="Kijelentkezés az adminból és a játékból is">Kijelentkezés</button><button class="g" id="cl">Bezárás</button></div>`);langBind();d.querySelector("#cl").onclick=()=>d.remove();d.querySelector("#lo").onclick=async()=>{await api("logout");dropA();d.remove();login()}};
 kpi();
 document.querySelectorAll(".bn button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;window.scrollTo(0,0);render()});
 ({users:tUsers,reports:tReports,club:tClub,upd:tUpd})[TAB]();if(TAB!="reports")cnt();if(TAB!="upd")updBadge()
}

// ----- frissítés (GitHub kiadások) -----
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>").replace(/`(.+?)`/g,"<code>$1</code>");
function md(t){const L=String(t||"").replace(/\r/g,"").split("\n");let h="",ul=false;
 for(const l of L){const m=/^\s*[-*]\s+(.*)$/.exec(l);if(m){if(!ul){h+="<ul style='margin:6px 0;padding-left:20px'>";ul=true}h+=`<li>${inl(m[1])}</li>`;continue}
  if(ul){h+="</ul>";ul=false}
  const hm=/^#{1,6}\s+(.*)$/.exec(l);if(hm){h+=`<b style="display:block;margin:8px 0 2px">${inl(hm[1])}</b>`;continue}
  if(l.trim())h+=`<p style="margin:4px 0">${inl(l)}</p>`}
 if(ul)h+="</ul>";return h}
async function updBadge(){if(!A)return;const r=await api("adm_upd_check",{});const n=r&&r.ok?r.newer.length:0;if(n!==UPD_N){UPD_N=n;kpi()}}

 if(!r||!r.ok){tb.innerHTML=`<div class="c"><h2>⬆️ Frissítés</h2><p class="bad">${esc((r&&r.err)||"Hiba")}</p></div>`;return}
 UPD_N=r.newer.length;
 const repoUrl="https://github.com/"+r.repo;
 let h=`<div class="c"><h2>⬆️ Frissítés</h2><div>Telepített verzió: <b>v${esc(r.cur)}</b></div><div class="m">Forrás: <a class="ul" href="${esc(repoUrl)}/releases" target="_blank" rel="noopener">${esc(r.repo)}</a> (GitHub kiadások)</div>`;
 if(r.err)h+=`<p class="bad" style="margin-bottom:0">A GitHub nem érhető el: ${esc(r.err)}</p>`;
 else if(!r.newer.length)h+=`<p class="ok" style="margin-bottom:0">✔ Naprakész vagy${r.latest?" (v"+esc(r.latest)+")":""}.</p>`;
 else h+=`<p style="margin-bottom:0">🆕 Elérhető új verzió: <b>v${esc(r.latest)}</b></p>`;
 h+=`<div class="row" style="margin-top:10px"><button class="g s" id="uc">Keresés most</button></div></div>`;
 const why=[];
 if(r.can&&r.can.enabled===false)why.push("A frissítés ki van kapcsolva a darts-config.php fájlban.");
 if(r.can&&!r.can.zip)why.push("A tárhelyen hiányzik a PHP ZipArchive bővítmény.");
 if(r.can&&!r.can.write)why.push("A webszerver nem tudja írni az alkalmazás fájljait.");
 if(r.can&&!r.can.net)why.push("A tárhely nem tud kimenő HTTPS kéréseket indítani.");
 if(r.newer.length){
  h+=r.newer.map(x=>`<div class="c"><h2>v${esc(x.v)}${x.name&&x.name!==x.v&&x.name!=="v"+x.v?" · "+esc(x.name):""}</h2><div class="m">${x.date?new Date(x.date).toLocaleDateString(LOC):""}${x.url?` · <a class="ul" href="${esc(x.url)}" target="_blank" rel="noopener">GitHub</a>`:""}</div>${md(x.notes)||'<div class="m">Nincs leírás a kiadáshoz.</div>'}</div>`).join("");
  if(why.length)h+=`<div class="c"><b class="bad">Ezen a tárhelyen nem telepíthető automatikusan:</b><ul style="margin:6px 0;padding-left:20px">${why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul><div class="m">Frissíts a fájlok kézi feltöltésével (lásd az INSTALL útmutató „Frissítés” fejezetét). A darts-config.php és a darts-data mappa maradjon érintetlen.</div></div>`;
  else if(!r.pri)h+=`<div class="c"><div class="m">A frissítést csak az alapadmin (a telepítőben megadott admin) telepítheti.</div></div>`;
  else h+=`<div class="c"><button id="ui">⬆️ Telepítés: v${esc(r.latest)}</button><div class="m" style="margin-top:8px">A cserélt fájlokról biztonsági mentés készül az adatmappába, a darts-config.php fájl és az adatok (fiókok, meccsek) nem változnak. Hiba esetén a korábbi verzió visszaáll.</div></div>`;
 }
 tb.innerHTML=h;
 document.getElementById("uc").onclick=()=>tUpd(true);
 const bi=document.getElementById("ui");if(bi)bi.onclick=()=>confirmBox("Frissítés telepítése","A v"+r.latest+" verzió letöltődik a GitHubról és felülírja az alkalmazás fájljait. A klub beállításai és az adatok nem változnak. Folytatod?","Telepítés",async()=>{
  bi.disabled=true;bi.textContent="Telepítés…";
  const x=await api("adm_upd_apply",{v:r.latest});
  if(!x||!x.ok){bi.disabled=false;bi.textContent="⬆️ Telepítés: v"+r.latest;return toast((x&&x.err)||"Hiba")}
  tb.innerHTML=`<div class="c"><h2 class="ok">✔ Frissítve: v${esc(x.cur)}</h2><div class="m">${x.files} fájl cserélve${x.sha?", az ellenőrző összeg egyezett":""}. Biztonsági mentés: ${esc(x.backup)}. Az oldal újratöltődik…</div></div>`;
  setTimeout(()=>location.reload(),2500)})
}
async function cnt(){if(!A)return;const r=await api("adm_list");if(r&&r.ok){STAT.bans=(r.bans||[]).length;setCount(r.reports.filter(p=>p.st=="open").length)}}
setInterval(()=>{if(!document.hidden&&TAB!="reports")cnt()},60000);
A?start():login();
</script></body></html>
